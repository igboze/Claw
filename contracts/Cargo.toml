[workspace]
resolver = "2"
members = ["common", "token", "ve", "governor", "constitution", "agent", "fees", "tests"]
# near-workspaces downloads a sandbox binary (Linux/macOS only), so plain `cargo test`
# skips the integration crate. Run it with `-p clawdao-integration-tests`.
default-members = ["common", "token", "ve", "governor", "constitution", "agent", "fees"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/igboze/Claw"

[workspace.dependencies]
near-sdk = "=5.26.1"
near-contract-standards = "=5.26.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clawdao-common = { path = "common" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
