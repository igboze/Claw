[package]
name = "clawdao-indexer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Standalone: not part of the contracts workspace (different targets and heavy deps).
[workspace]

[dependencies]
near-lake-framework = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
